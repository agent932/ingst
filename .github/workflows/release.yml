name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Create a draft release so both build jobs can upload to it ─────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      # The version lives in four files and the tag is a fifth. Catch drift here
      # rather than shipping installers whose filename disagrees with the app.
      - name: Check versions agree with the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)

          echo "tag=$tag package.json=$pkg package-lock.json=$lock tauri.conf.json=$conf Cargo.toml=$cargo"

          for name in pkg lock conf cargo; do
            eval "value=\$$name"
            if [ "$value" != "$tag" ]; then
              echo "::error::$name is $value but the tag is $tag"
              exit 1
            fi
          done

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Ingst ${tag}`,
              body: 'See the assets below to download the installer for your platform.',
              draft: true,
              prerelease: false,
            });
            return data.id;

  # ── macOS (Apple Silicon) ───────────────────────────────────────────────────
  build-macos:
    needs: create-release
    runs-on: macos-latest   # macos-14, arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Homebrew's ffmpeg is dynamically linked against /opt/homebrew/Cellar/...
      # dylibs, so copying just the executable produced a sidecar that could not
      # launch on any machine without that exact Homebrew install. Every release
      # built that way silently shipped without video thumbnails or metadata.
      # These are statically linked builds, pinned by tag and checksum.
      - name: Fetch static ffmpeg/ffprobe sidecars
        env:
          FFMPEG_RELEASE: b6.1.1
          FFMPEG_SHA256:  a90e3db6a3fd35f6074b013f948b1aa45b31c6375489d39e572bea3f18336584
          FFPROBE_SHA256: bb2db6f5d8cef919da12fbf592119a987202a8c060a886f3cab091f9cab90b64
        run: |
          set -euo pipefail
          base="https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_RELEASE}"
          mkdir -p src-tauri/binaries

          curl -fsSL "$base/ffmpeg-darwin-arm64"  -o src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          curl -fsSL "$base/ffprobe-darwin-arm64" -o src-tauri/binaries/ffprobe-aarch64-apple-darwin

          echo "${FFMPEG_SHA256}  src-tauri/binaries/ffmpeg-aarch64-apple-darwin"   | shasum -a 256 -c -
          echo "${FFPROBE_SHA256}  src-tauri/binaries/ffprobe-aarch64-apple-darwin" | shasum -a 256 -c -

          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin \
                   src-tauri/binaries/ffprobe-aarch64-apple-darwin

          # arm64 macOS refuses to exec an unsigned binary. Ad-hoc sign so the
          # verification step below can run them; Tauri re-signs with the real
          # identity during bundling when signing secrets are configured.
          codesign --force --sign - src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          codesign --force --sign - src-tauri/binaries/ffprobe-aarch64-apple-darwin

      # Guard against ever re-introducing a dynamically linked sidecar. Without
      # this the failure is invisible until a user runs the shipped app.
      - name: Verify sidecars are self-contained and runnable
        run: |
          set -euo pipefail
          fail=0
          for bin in src-tauri/binaries/ffmpeg-* src-tauri/binaries/ffprobe-*; do
            echo "── $bin"
            external=$(otool -L "$bin" | tail -n +2 | awk '{print $1}' \
                       | grep -vE '^(/usr/lib/|/System/Library/)' || true)
            if [ -n "$external" ]; then
              echo "::error::$bin links against libraries absent on user machines:"
              echo "$external"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          ./src-tauri/binaries/ffmpeg-aarch64-apple-darwin  -version | head -1
          ./src-tauri/binaries/ffprobe-aarch64-apple-darwin -version | head -1

      - name: Enable externalBin in tauri.conf.json
        run: |
          jq '.bundle.externalBin = ["binaries/ffprobe", "binaries/ffmpeg"]' \
            src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN:                ${{ secrets.GITHUB_TOKEN }}
          # Code-signing (optional — skip if secrets are not configured)
          APPLE_CERTIFICATE:           ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD:  ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:      ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization (optional)
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:              ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

  # ── Windows (x86-64) ────────────────────────────────────────────────────────
  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Previously pulled BtbN's "latest" rolling tag, which is unpinned and
      # unverified, so two runs of the same commit could ship different ffmpeg
      # builds. Same pinned, checksummed source as the macOS job.
      - name: Fetch static ffmpeg/ffprobe sidecars
        shell: bash
        env:
          FFMPEG_RELEASE: b6.1.1
          FFMPEG_SHA256:  04e1307997530f9cf2fe35cba2ca7e8875ca91da02f89d6c7243df819c94ad00
          FFPROBE_SHA256: 3a7e2dc003dc2cd1472827e4c7c4f056ae1ae0ae7c5bbc580c99b49827351ba4
        run: |
          set -euo pipefail
          base="https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_RELEASE}"
          mkdir -p src-tauri/binaries

          curl -fsSL "$base/ffmpeg-win32-x64"  -o src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          curl -fsSL "$base/ffprobe-win32-x64" -o src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe

          echo "${FFMPEG_SHA256} *src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"   | sha256sum -c -
          echo "${FFPROBE_SHA256} *src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe" | sha256sum -c -

      - name: Verify sidecars are runnable
        shell: bash
        run: |
          set -euo pipefail
          ./src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe  -version | head -1
          ./src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe -version | head -1

      - name: Enable externalBin in tauri.conf.json
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri\tauri.conf.json | ConvertFrom-Json
          $conf.bundle | Add-Member -Force -NotePropertyName externalBin `
            -NotePropertyValue @('binaries/ffprobe', 'binaries/ffmpeg')
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri\tauri.conf.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

  # ── Publish once both builds succeed ───────────────────────────────────────
  publish-release:
    needs: [create-release, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false,
            });

[package]
name = "ingst"
version = "0.2.0"
description = "Media ingestion desktop application for creators"
authors = ["Ingst Team"]
edition = "2021"

[lib]
name = "ingst_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Development builds were unusably slow for the work this app actually does.
# `full_hash` measured 27 MB/s under `tauri dev` against 530 MB/s in release —
# a 20x gap, because everything including `sha2` compiled at opt-level 0. Since
# every byte is hashed twice (once while copying, once verifying), that put a
# ~13 MB/s ceiling on an ingest no matter how fast the card or the destination
# was, and made any performance observed in dev meaningless.
#
# Dependencies are fully optimised; our own crate stays at opt-level 1, which
# removes the worst of the debug overhead while keeping compiles quick and
# backtraces useful.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
log = "0.4"
thiserror = "2"
kamadak-exif = "0.5"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"

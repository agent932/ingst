<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Ingst app icon — source of truth. Regenerate every platform asset with:
        npx tauri icon src-tauri/icons/icon.svg

    The mark: a heavy wedge descending onto a shelf. Footage comes off the card
    and lands somewhere solid. The wedge points DOWN on purpose — a wedge above
    a bar pointing up is the macOS eject glyph, which says the opposite of what
    this app does.

    Drawn on a 64-unit grid inside a squircle inset 100px, so the tile matches
    the proportions of other macOS icons rather than bleeding to the canvas edge.
  -->
  <g transform="translate(100,100) scale(12.875)">
    <!-- Near-black tile, with a barely-there rim so it does not disappear
         against a dark Dock or a dark Finder sidebar. -->
    <rect width="64" height="64" rx="14" fill="#14181F"/>
    <rect x="0.4" y="0.4" width="63.2" height="63.2" rx="13.7"
          fill="none" stroke="#2A313D" stroke-width="0.8"/>

    <!-- The descent. -->
    <path d="M24 10 H40 V25 H49 L32 41 L15 25 H24 Z" fill="#2DD4BF"/>

    <!-- The shelf it lands on. -->
    <rect x="13" y="47" width="38" height="9" rx="4.5" fill="#64748B"/>
  </g>
</svg>
